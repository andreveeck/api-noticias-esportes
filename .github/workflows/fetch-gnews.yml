name: Fetch GNews Articles

on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 13 * * *"
    - cron: "0 16 * * *"
    - cron: "0 19 * * *"
    - cron: "0 22 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  fetch-gnews:
    runs-on: ubuntu-latest
    steps:
      - name: Call GNews ingestion endpoint
        run: |
          HTTP_CODE=$(curl -sSL -o response.json -w "%{http_code}" -X GET "${{ secrets.APP_URL }}/api/cron/fetch-gnews" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          echo "HTTP: $HTTP_CODE"
          echo "Body:"
          cat response.json

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi
